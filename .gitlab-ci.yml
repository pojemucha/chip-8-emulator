stages:
  - test
  - assemble
  - deploy

test_code:
  stage: test
  image: rust:latest
  script:
    - cargo fmt -- --check
    - cargo clippy -- -D warnings

build_linux:
  stage: assemble
  image: rust:latest
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/chip8

build_windows:
  stage: assemble
  tags:
    - saas-windows-medium-amd64
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/chip8.exe

build_macos:
  stage: assemble
  tags:
    - saas-macos-medium-m1
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/chip8

publish:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for version $CI_COMMIT_TAG$"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release of emulator version $CI_COMMIT_TAG$"
    tag_name: "$CI_COMMIT_TAG"
  only:
    - tags
