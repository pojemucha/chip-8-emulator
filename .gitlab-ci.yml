stages:
  - test
  - assemble
#  - deploy

test_code:
  stage: test
  tags: 
    - local-cachyos
  script:
    - cargo fmt -- --check
    - cargo clippy -- -D warnings

build_linux:
  stage: assemble
  tags: 
    - local-cachyos
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/chip8

build_windows:
  stage: assemble
  tags:
    - local-cachyos
  script:
    - cargo build --release --target x86_64-pc-windows-gnu
  artifacts:
    paths:
      - target/x86_64-pc-windows-gnu/release/chip8.exe

